name: Event history performance gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  event-history-performance:
    name: 10,000-event IndexedDB capture (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the IndexedDB event-history benchmark
        run: npm run benchmark:event-history
