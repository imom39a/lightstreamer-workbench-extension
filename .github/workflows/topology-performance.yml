name: Performance gates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  event-history-performance:
    name: 10,000-event IndexedDB capture (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the IndexedDB event-history benchmark
        run: npm run benchmark:event-history

  topology-performance:
    name: 1,000 logical updates/sec for 60 seconds
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Chrome for Testing
        uses: actions/cache@v5
        with:
          path: .cache/lsew-browsers
          key: chrome-for-testing-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chrome for Testing
        run: npm run fixture:browser:install

      - name: Typecheck
        run: npm run typecheck

      - name: Run the real-Chrome topology performance gate
        shell: bash
        env:
          LSEW_TOPOLOGY_PERF_OUTPUT: artifacts/topology-performance.json
        run: |
          mkdir -p artifacts
          npm run benchmark:topology 2>&1 | tee artifacts/topology-performance.log

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: topology-performance
          path: artifacts/
          if-no-files-found: warn
