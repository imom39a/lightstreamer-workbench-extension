name: Unified npm MCP companion

on:
  pull_request:
  push:
    paths:
      - ".github/workflows/agent-companion.yml"
      - "package*.json"
      - "public/manifest.json"
      - "RELEASE.md"
      - "agent/**"
      - ".agents/skills/lightstreamer-workbench/**"
      - "src/agent/**"
      - "src/extension/panel/agent-*.ts"
      - "src/extension/panel/react/agent-access.tsx"
      - "src/extension/panel/react/workbench-panel.tsx"
      - "src/extension/panel/react/workbench-panel.css"
      - "scripts/*agent*.mjs"
      - "scripts/*firefox*"
      - "scripts/extension-manifest.*"
      - "src/extension/analytics/**"
      - "src/extension/analytics-consent/**"
      - "src/extension/firefox-*.ts"
      - "vite.config.ts"
      - "tests/firefox*/**"
      - "tests/firefox*.test.ts"
      - "scripts/package-mcp-release.mjs"
      - "scripts/package-mcp-release.test.mjs"
      - "tests/agent-*.test.ts"
      - "tests/support/workbench-agent-proof.ts"
      - "tests/extension-panel.browser.spec.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-companion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build one npm artifact
    runs-on: ubuntu-latest
    outputs:
      filename: ${{ steps.release.outputs.filename }}
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: node --test scripts/prepare-agent-release.test.mjs scripts/verify-agent-publication.test.mjs
      - name: Select release version
        id: release
        env:
          PUBLISH_ENABLED: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AGENT_NPM_PUBLISH_ENABLED == 'true' }}
        run: |
          if [ "$PUBLISH_ENABLED" = "true" ]; then
            node scripts/prepare-agent-release.mjs --release
          else
            node scripts/prepare-agent-release.mjs
          fi
      - run: npm run agent:pack
      - uses: actions/upload-artifact@v6
        with:
          name: workbench-agent-npm
          path: |
            release/*.tgz
            release/agent-release.json
          if-no-files-found: error

  portable:
    needs: package
    name: Same npm artifact (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          name: workbench-agent-npm
          path: release
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Use the artifact version for all platform checks
        shell: bash
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const plan = JSON.parse(fs.readFileSync("release/agent-release.json")); const file = "agent/package.json"; const metadata = JSON.parse(fs.readFileSync(file)); if (metadata.name !== plan.name || plan.sha !== process.env.GITHUB_SHA) throw new Error("Artifact source mismatch"); fs.writeFileSync(file, JSON.stringify({...metadata, version: plan.version, gitHead: plan.sha}, null, 2) + "\n");'
      - run: npm run typecheck
      - name: Prove automatic connection, optional authentication, process startup and MCP routing
        run: npx vitest run tests/agent-portable.test.ts tests/agent-connection.test.ts tests/agent-runtime.test.ts --maxWorkers=1
      - name: Check documented Windows setup and packaged guide
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm.cmd run agent:build
          if ($LASTEXITCODE -ne 0) { throw 'Companion build failed.' }
          $workbenchNode = (Get-Command node.exe).Source
          $workbenchCli = (Resolve-Path '.\agent\dist\cli.mjs').Path
          $workbenchExtensionId = 'a' * 32
          $workbenchSetup = & $workbenchNode $workbenchCli setup --extension-id $workbenchExtensionId | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Setup failed.' }
          $entry = $workbenchSetup.mcpServers.'lightstreamer-workbench'
          $metadata = Get-Content agent/package.json | ConvertFrom-Json
          $packageSpec = "$($metadata.name)@$($metadata.version)"
          if ($entry.command -ne 'npx' -or $entry.args[0] -ne '--yes' -or $entry.args[1] -ne $packageSpec -or $entry.env -or $workbenchSetup.auth -ne 'off') { throw 'Default setup must not require credentials.' }
          $authenticatedSetup = & $workbenchNode $workbenchCli setup --auth required --extension-id $workbenchExtensionId | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $authenticatedSetup.mcpServers.'lightstreamer-workbench'.env.LSEW_AGENT_CONNECTION -notmatch '^wb1:24817:[a-f0-9]{64}$') { throw 'Optional authentication configuration failed.' }
          $package = npm.cmd pack ./agent --dry-run --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Package inspection failed.' }
          if ('WINDOWS.md' -notin $package[0].files.path) { throw 'Windows guide missing from package.' }
      - name: Cache Chrome for Testing
        uses: actions/cache@v5
        with:
          path: .cache/lsew-browsers
          key: chrome-for-testing-agent-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm run fixture:browser:install
      - name: Prove the installed npm package and real Chrome connection
        env:
          LSEW_AGENT_PACKAGE_TARBALL: release/${{ needs.package.outputs.filename }}
        run: npm run agent:test:extension
      - name: Guard context budgets with IndexedDB and the installed artifact
        env:
          LSEW_AGENT_TEST_CLI: test-results/agent-package/node_modules/lightstreamer-workbench-agent/dist/cli.mjs
        run: npx vitest run tests/agent-mcp-budget.test.ts tests/agent-response-pagination.test.ts tests/agent-candidate-budget.test.ts tests/agent-global-pagination.test.ts tests/agent-status-budget.test.ts --maxWorkers=1 --no-file-parallelism

  firefox:
    needs: package
    name: Firefox ${{ matrix.firefox }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, firefox: latest}
          - {os: macos-latest, firefox: latest}
          - {os: ubuntu-latest, firefox: latest}
          - {os: ubuntu-latest, firefox: '140.0'}
          - {os: ubuntu-latest, firefox: '140.17.0esr'}
          - {os: ubuntu-latest, firefox: '153.4.0esr'}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: browser-actions/setup-firefox@49cdbfc200e72729ff368b519201904af267e90c
        id: firefox
        with:
          firefox-version: ${{ matrix.firefox }}
      - uses: actions/download-artifact@v6
        with:
          name: workbench-agent-npm
          path: release
      - run: npm ci
      - run: python -m pip install -r scripts/firefox-requirements.txt
      - name: Use the verified npm artifact version
        shell: bash
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const plan = JSON.parse(fs.readFileSync("release/agent-release.json")); const file = "agent/package.json"; const metadata = JSON.parse(fs.readFileSync(file)); if (metadata.name !== plan.name || plan.sha !== process.env.GITHUB_SHA) throw new Error("Artifact source mismatch"); fs.writeFileSync(file, JSON.stringify({...metadata, version: plan.version, gitHead: plan.sha}, null, 2) + "\n");'
      - name: Install and prove the same npm tarball
        env:
          LSEW_AGENT_PACKAGE_TARBALL: release/${{ needs.package.outputs.filename }}
        run: npm run agent:test:package
      - run: npm run build:firefox
        env:
          LSEW_ANALYTICS_DISABLED: '1'
      - name: Prove Firefox Capture, IndexedDB, exact-origin MCP, restart and revocation
        env:
          LSEW_FIREFOX_BINARY: ${{ steps.firefox.outputs.firefox-path }}
          LSEW_FIREFOX_PYTHON: python
          LSEW_FIREFOX_EXTENSION_ONLY: '1'
          LSEW_FIREFOX_ARTIFACTS: test-results/firefox-portable
          LSEW_AGENT_TEST_CLI: test-results/agent-package/node_modules/lightstreamer-workbench-agent/dist/cli.mjs
        run: npm run test:firefox
      - uses: actions/setup-java@v5
        if: runner.os == 'Linux'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Start the official Lightstreamer fixture
        if: runner.os == 'Linux'
        run: npm run fixture:start
      - name: Prove Firefox to official-client Local Injection and Scenario delivery
        if: runner.os == 'Linux'
        env:
          LSEW_FIREFOX_BINARY: ${{ steps.firefox.outputs.firefox-path }}
          LSEW_FIREFOX_PYTHON: python
          LSEW_AGENT_TEST_CLI: test-results/agent-package/node_modules/lightstreamer-workbench-agent/dist/cli.mjs
        run: npm run test:firefox
      - name: Build offline native-consent test configuration
        env:
          VITE_LSEW_GA_MEASUREMENT_ID: G-TEST123
          VITE_LSEW_GA_API_SECRET: firefox-local-consent-proof
        run: node scripts/build-extension.mjs --browser firefox --outDir .cache/firefox-consent-dist
      - name: Prove native analytics consent without external traffic
        env:
          LSEW_FIREFOX_BINARY: ${{ steps.firefox.outputs.firefox-path }}
          LSEW_FIREFOX_PYTHON: python
          LSEW_FIREFOX_EXTENSION_ONLY: '1'
          LSEW_FIREFOX_CONSENT_PROOF: '1'
          LSEW_FIREFOX_DIST: .cache/firefox-consent-dist
          LSEW_FIREFOX_ARTIFACTS: test-results/firefox-consent
        run: npm run test:firefox
      - name: Validate the Firefox manifest and packaged code
        if: runner.os == 'Linux' && matrix.firefox == 'latest'
        run: npx --yes web-ext@10.7.0 lint --source-dir dist-firefox --output json > test-results/firefox/web-ext.json
      - name: Stop the owned fixture
        if: always() && runner.os == 'Linux'
        run: npm run fixture:stop
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: firefox-proof-${{ matrix.os }}-${{ matrix.firefox }}
          path: test-results/firefox*/

  release-bundle:
    needs: [package, portable, firefox]
    name: Assemble downloadable MCP release bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: node --test scripts/package-mcp-release.test.mjs
      - uses: actions/download-artifact@v6
        with:
          name: workbench-agent-npm
          path: release
      - name: Package the exact-source extension ZIP
        run: npm run release:zip -- --skip-typecheck --skip-tests
      - name: Combine verified portable artifacts
        run: node scripts/package-mcp-release.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: workbench-mcp-release-bundle
          path: release/lightstreamer-workbench-mcp-v*.zip
          if-no-files-found: error

  publish:
    name: Publish the verified npm artifact
    needs: [package, portable, firefox, release-bundle]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.package.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v6
        with:
          name: workbench-agent-npm
          path: release
      - name: Publish with npm trusted publishing
        env:
          AGENT_TARBALL: ./release/${{ needs.package.outputs.filename }}
        run: npm publish "$AGENT_TARBALL" --access public --provenance --ignore-scripts
      - name: Verify registry version
        run: node scripts/verify-agent-publication.mjs
