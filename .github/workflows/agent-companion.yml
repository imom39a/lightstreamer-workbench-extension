name: Unified browser and MCP release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_source:
        description: Full approved source commit; must equal this main dispatch SHA
        type: string
        required: true
      publish_chrome:
        description: Submit the frozen Chrome package for public review
        type: boolean
        default: false
      publish_firefox:
        description: Submit the frozen listed Firefox version and reviewer source
        type: boolean
        default: false
      publish_npm:
        description: Publish the frozen companion with npm trusted publishing
        type: boolean
        default: false
      firefox_metadata:
        description: Committed JSON file containing explicit release and reviewer notes
        type: string
        default: store-listing/firefox-submission.json

permissions:
  contents: read
  actions: read

concurrency:
  group: agent-companion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Select required checks
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.selection.outputs.plan }}
      docs: ${{ steps.selection.outputs.docs }}
      site: ${{ steps.selection.outputs.site }}
      runtime: ${{ steps.selection.outputs.runtime }}
      companion: ${{ steps.selection.outputs.companion }}
      panel: ${{ steps.selection.outputs.panel }}
      fixture: ${{ steps.selection.outputs.fixture }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
      - name: Verify check selection and aggregate contracts
        run: node --test scripts/preflight.test.mjs
      - name: Select changed-input or full-release checks
        id: selection
        env:
          PREFLIGHT_RELEASE: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/preflight.mjs --ci --dry-run --github-output "$GITHUB_OUTPUT"

  checks:
    name: Source and documentation checks
    needs: [plan, package]
    if: always() && needs.plan.result == 'success' && (needs.plan.outputs.companion != 'true' || needs.package.result == 'success') && needs.plan.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm run docs:check
      - run: npm run test:scripts
      - run: npm run typecheck
        if: needs.plan.outputs.runtime == 'true'
      - run: npm run test:release
        if: needs.plan.outputs.runtime == 'true'

  package:
    needs: plan
    if: needs.plan.outputs.companion == 'true'
    name: Freeze one browser and npm candidate
    runs-on: ubuntu-latest
    outputs:
      filename: ${{ steps.frozen.outputs.filename }}
      version: ${{ steps.frozen.outputs.version }}
      chrome: ${{ steps.frozen.outputs.chrome }}
      firefox: ${{ steps.frozen.outputs.firefox }}
      npm: ${{ steps.frozen.outputs.npm }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Recover the original candidate on a whole-run retry
        id: recovery
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_EXPECTED_SOURCE: ${{ inputs.expected_source || github.sha }}
        run: node scripts/release.mjs recovery --expected-source "$RELEASE_EXPECTED_SOURCE" --github-output "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v6
        if: steps.recovery.outputs.mode == 'recover'
        with:
          artifact-ids: ${{ steps.recovery.outputs.artifact_id }}
          path: release/frozen-input
          merge-multiple: true
      - run: npm ci
      - name: Freeze all four exact inputs before heavy verification
        if: steps.recovery.outputs.mode == 'prepare'
        env:
          RELEASE_EXPECTED_SOURCE: ${{ inputs.expected_source || github.sha }}
          RELEASE_METADATA: ${{ inputs.firefox_metadata || 'store-listing/firefox-submission.json' }}
          RELEASE_PUBLISH_CHROME: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_chrome || false }}
          RELEASE_PUBLISH_FIREFOX: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_firefox || false }}
          RELEASE_PUBLISH_NPM: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_npm || false }}
          VITE_LSEW_GA_MEASUREMENT_ID: ${{ secrets.VITE_LSEW_GA_MEASUREMENT_ID }}
          VITE_LSEW_GA_API_SECRET: ${{ secrets.VITE_LSEW_GA_API_SECRET }}
          VITE_LSEW_GA_DEBUG: 'false'
        run: node scripts/release.mjs prepare --expected-source "$RELEASE_EXPECTED_SOURCE" --metadata "$RELEASE_METADATA"
      - name: Retain the immutable first-attempt candidate
        if: steps.recovery.outputs.mode == 'prepare'
        uses: actions/upload-artifact@v6
        with:
          name: workbench-frozen-release-${{ github.run_id }}
          path: release/frozen-input/release-bundle.zip
          if-no-files-found: error
          retention-days: 90
      - name: Restore and validate all frozen inputs and the selected version
        id: frozen
        run: node scripts/release.mjs restore --bundle release/frozen-input/release-bundle.zip --out-dir release/frozen --expected-source "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Keep the companion artifact available for manual consumers
        if: steps.recovery.outputs.mode == 'prepare'
        uses: actions/upload-artifact@v6
        with:
          name: workbench-agent-npm
          path: |
            release/frozen/agent/*.tgz
            release/frozen/agent-release.json
          if-no-files-found: error
          retention-days: 90

  portable:
    if: needs.plan.outputs.companion == 'true'
    needs: [plan, package]
    name: Same npm artifact (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          name: workbench-frozen-release-${{ github.run_id }}
          path: release/frozen-input
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: Restore the frozen manifest and exact artifact bytes
        run: node scripts/release.mjs restore --bundle release/frozen-input/release-bundle.zip --out-dir release/frozen --expected-source "$GITHUB_SHA"
      - name: Use the artifact version for all platform checks
        run: node scripts/release.mjs use-agent --manifest release/frozen/release-manifest.json --expected-source "$GITHUB_SHA"
      - run: npm run typecheck
      - name: Prove cross-agent skill setup, Evidence recovery, automatic connection and MCP routing
        run: npx vitest run tests/agent-setup.test.ts tests/agent-source-discovery.test.ts tests/agent-search.test.ts tests/agent-portable.test.ts tests/agent-connection.test.ts tests/agent-runtime.test.ts --maxWorkers=1 --no-file-parallelism
      - name: Check documented Windows setup and packaged guide
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm.cmd run agent:build
          if ($LASTEXITCODE -ne 0) { throw 'Companion build failed.' }
          $workbenchNode = (Get-Command node.exe).Source
          $workbenchCli = (Resolve-Path '.\agent\dist\cli.mjs').Path
          $workbenchExtensionId = 'a' * 32
          $workbenchSetup = & $workbenchNode $workbenchCli setup --extension-id $workbenchExtensionId | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Setup failed.' }
          $entry = $workbenchSetup.mcpServers.'lightstreamer-workbench'
          $metadata = Get-Content agent/package.json | ConvertFrom-Json
          $packageSpec = "$($metadata.name)@$($metadata.version)"
          if ($entry.command -ne 'npx' -or $entry.args[0] -ne '--yes' -or $entry.args[1] -ne $packageSpec -or $entry.env -or $workbenchSetup.auth -ne 'off') { throw 'Default setup must not require credentials.' }
          $authenticatedSetup = & $workbenchNode $workbenchCli setup --auth required --extension-id $workbenchExtensionId | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $authenticatedSetup.mcpServers.'lightstreamer-workbench'.env.LSEW_AGENT_CONNECTION -notmatch '^wb1:24817:[a-f0-9]{64}$') { throw 'Optional authentication configuration failed.' }
          $package = npm.cmd pack ./agent --dry-run --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Package inspection failed.' }
          if ('WINDOWS.md' -notin $package[0].files.path) { throw 'Windows guide missing from package.' }
      - name: Cache Chrome for Testing
        uses: actions/cache@v5
        with:
          path: .cache/lsew-browsers
          key: chrome-for-testing-agent-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm run fixture:browser:install
      - name: Prove the installed npm package and exact frozen Chrome connection
        env:
          LSEW_FROZEN_RELEASE_MANIFEST: release/frozen/release-manifest.json
          LSEW_AGENT_PACKAGE_TARBALL: release/frozen/${{ needs.package.outputs.filename }}
        run: npm run agent:test:extension
      - name: Retain failed Chrome and MCP proof attempts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: companion-chrome-failure-${{ matrix.os }}-${{ github.run_attempt }}
          path: test-results/browser-diagnostics*/
          if-no-files-found: ignore
          retention-days: 14
      - name: Guard context budgets with IndexedDB and the installed artifact
        env:
          LSEW_AGENT_TEST_CLI: test-results/agent-package/node_modules/lightstreamer-workbench-agent/dist/cli.mjs
        run: npx vitest run tests/agent-mcp-budget.test.ts tests/agent-response-pagination.test.ts tests/agent-candidate-budget.test.ts tests/agent-global-pagination.test.ts tests/agent-status-budget.test.ts --maxWorkers=1 --no-file-parallelism

  firefox:
    if: needs.plan.outputs.companion == 'true'
    needs: [plan, package]
    name: Firefox ${{ matrix.firefox }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, firefox: latest}
          - {os: macos-latest, firefox: latest}
          - {os: ubuntu-latest, firefox: latest}
          - {os: ubuntu-latest, firefox: '140.0'}
          - {os: ubuntu-latest, firefox: '140.17.0esr'}
          - {os: ubuntu-latest, firefox: '153.4.0esr'}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1.7.2, including the executable
        id: firefox
        with:
          firefox-version: ${{ matrix.firefox }}
      - uses: actions/download-artifact@v6
        with:
          name: workbench-frozen-release-${{ github.run_id }}
          path: release/frozen-input
      - run: npm ci
      - run: python -m pip install -r scripts/firefox-requirements.txt
      - name: Restore the frozen manifest and exact artifact bytes
        run: node scripts/release.mjs restore --bundle release/frozen-input/release-bundle.zip --out-dir release/frozen --expected-source "$GITHUB_SHA"
      - name: Use the verified npm artifact version
        run: node scripts/release.mjs use-agent --manifest release/frozen/release-manifest.json --expected-source "$GITHUB_SHA"
      - name: Install and prove the same npm tarball
        env:
          LSEW_AGENT_PACKAGE_TARBALL: release/frozen/${{ needs.package.outputs.filename }}
        run: npm run agent:test:package
      - name: Load the exact frozen Firefox ZIP
        run: node scripts/release.mjs browser-input --manifest release/frozen/release-manifest.json --expected-source "$GITHUB_SHA" --browser firefox --out-dir .cache/frozen-firefox-dist
      - name: Prove Firefox Capture, IndexedDB, exact-origin MCP, restart and revocation
        env:
          LSEW_FIREFOX_DIST: .cache/frozen-firefox-dist
          LSEW_FROZEN_RELEASE_MANIFEST: release/frozen/release-manifest.json
          LSEW_FIREFOX_BINARY: ${{ steps.firefox.outputs.firefox-path }}
          LSEW_FIREFOX_PYTHON: python
          LSEW_FIREFOX_EXTENSION_ONLY: '1'
          LSEW_FIREFOX_ARTIFACTS: test-results/firefox-portable
          LSEW_AGENT_TEST_CLI: test-results/agent-package/node_modules/lightstreamer-workbench-agent/dist/cli.mjs
        run: npm run test:firefox
      - uses: actions/setup-java@v5
        if: runner.os == 'Linux'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Start the official Lightstreamer fixture
        id: firefox_fixture
        if: runner.os == 'Linux'
        run: npm run fixture:start
      - name: Prove Firefox to official-client Local Injection and Scenario delivery
        if: runner.os == 'Linux'
        env:
          LSEW_FIREFOX_DIST: .cache/frozen-firefox-dist
          LSEW_FROZEN_RELEASE_MANIFEST: release/frozen/release-manifest.json
          LSEW_FIREFOX_BINARY: ${{ steps.firefox.outputs.firefox-path }}
          LSEW_FIREFOX_PYTHON: python
          LSEW_AGENT_TEST_CLI: test-results/agent-package/node_modules/lightstreamer-workbench-agent/dist/cli.mjs
        run: npm run test:firefox
      - name: Build offline native-consent test configuration
        env:
          VITE_LSEW_GA_MEASUREMENT_ID: G-TEST123
          VITE_LSEW_GA_API_SECRET: firefox-local-consent-proof
        run: node scripts/build-extension.mjs --browser firefox --outDir .cache/firefox-consent-dist
      - name: Prove native analytics consent without external traffic
        env:
          LSEW_FIREFOX_BINARY: ${{ steps.firefox.outputs.firefox-path }}
          LSEW_FIREFOX_PYTHON: python
          LSEW_FIREFOX_EXTENSION_ONLY: '1'
          LSEW_FIREFOX_CONSENT_PROOF: '1'
          LSEW_FIREFOX_DIST: .cache/firefox-consent-dist
          LSEW_FIREFOX_ARTIFACTS: test-results/firefox-consent
        run: npm run test:firefox
      - name: Validate the Firefox manifest and packaged code
        if: runner.os == 'Linux' && matrix.firefox == 'latest'
        run: npx --yes web-ext@10.7.0 lint --source-dir .cache/frozen-firefox-dist --output json > test-results/firefox/web-ext.json
      - name: Audit the Firefox ZIP structure, version and release budget
        if: runner.os == 'Linux' && matrix.firefox == 'latest'
        run: npm run release:package:firefox -- --skip-typecheck --skip-tests --skip-build --dist .cache/frozen-firefox-dist --out-dir test-results/firefox-release
      - name: Stop the owned fixture
        if: always() && runner.os == 'Linux' && (steps.firefox_fixture.outcome == 'success' || steps.firefox_fixture.outcome == 'failure')
        run: npm run fixture:stop
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: firefox-proof-${{ matrix.os }}-${{ matrix.firefox }}
          path: test-results/firefox*/

  fixture:
    name: Full fixture release gate
    if: github.event_name == 'workflow_dispatch'
    needs: [plan, package]
    uses: ./.github/workflows/fixture-scripts.yml
    with:
      full: true
      frozen_artifact: workbench-frozen-release-${{ github.run_id }}

  panel:
    name: Full panel release gate
    if: github.event_name == 'workflow_dispatch'
    needs: [plan, package]
    uses: ./.github/workflows/panel-ui.yml
    with:
      full: true
      frozen_artifact: workbench-frozen-release-${{ github.run_id }}

  site:
    name: Full public site release gate
    if: github.event_name == 'workflow_dispatch'
    needs: [plan, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:site
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: release-site-failure-${{ github.run_attempt }}
          path: |
            test-results/site/
            test-results/site-report/
          if-no-files-found: ignore

  release-bundle:
    if: needs.plan.outputs.companion == 'true'
    needs: [plan, package, portable, firefox]
    name: Assemble downloadable MCP release bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
      - uses: actions/download-artifact@v6
        with:
          name: workbench-frozen-release-${{ github.run_id }}
          path: release/frozen-input
      - name: Validate the verified candidate without rebuilding
        run: node scripts/release.mjs restore --bundle release/frozen-input/release-bundle.zip --out-dir release/frozen --expected-source "$GITHUB_SHA"
      - uses: actions/upload-artifact@v6
        with:
          name: workbench-mcp-release-bundle-${{ github.run_attempt }}
          path: release/frozen-input/release-bundle.zip
          if-no-files-found: error
          retention-days: 90

  verification:
    name: Bind full verification to the frozen manifest
    if: always() && github.event_name == 'workflow_dispatch' && needs.package.result == 'success'
    needs: [plan, checks, package, portable, firefox, fixture, panel, site, release-bundle]
    runs-on: ubuntu-latest
    outputs:
      artifact: workbench-release-verification-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
      - uses: actions/download-artifact@v6
        with:
          name: workbench-frozen-release-${{ github.run_id }}
          path: release/frozen-input
      - run: node scripts/release.mjs restore --bundle release/frozen-input/release-bundle.zip --out-dir release/frozen --expected-source "$GITHUB_SHA"
      - name: Require every full release gate
        env:
          RELEASE_GATE_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/release.mjs verify --manifest release/frozen/release-manifest.json --expected-source "$GITHUB_SHA" --verification release/release-verification.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: workbench-release-verification-${{ github.run_attempt }}
          path: release/release-verification.json
          if-no-files-found: error
          retention-days: 90

  publish-chrome:
    name: Submit Chrome Web Store
    needs: [package, verification]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.package.outputs.chrome == 'true' && needs.verification.result == 'success'
    runs-on: ubuntu-latest
    environment: chrome-store
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - uses: actions/download-artifact@v6
        with:
          name: workbench-frozen-release-${{ github.run_id }}
          path: release/frozen-input
      - run: node scripts/release.mjs restore --bundle release/frozen-input/release-bundle.zip --out-dir release/frozen --expected-source "$GITHUB_SHA"
      - uses: actions/download-artifact@v6
        with:
          name: ${{ needs.verification.outputs.artifact }}
          path: release
      - name: Recover the latest saved channel receipt
        id: receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs receipt-recovery --channel chrome --expected-source "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v6
        if: steps.receipt.outputs.mode == 'recover'
        with:
          artifact-ids: ${{ steps.receipt.outputs.artifact_id }}
          path: release/receipts
          merge-multiple: true
      - name: Submit or reconcile the exact frozen chrome candidate
        env:
          RELEASE_EXPECTED_SOURCE: ${{ inputs.expected_source }}
          CWS_RESOURCE: ${{ vars.CWS_RESOURCE }}
          CWS_ACCESS_TOKEN: ${{ secrets.CWS_ACCESS_TOKEN }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: node scripts/release.mjs submit --channel chrome --manifest release/frozen/release-manifest.json --expected-source "$RELEASE_EXPECTED_SOURCE" --verification release/release-verification.json --receipt release/receipts/chrome.json
      - name: Preserve partial and accepted publication receipts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: workbench-release-receipt-chrome-${{ github.run_attempt }}
          path: release/receipts/chrome.json
          if-no-files-found: error
          retention-days: 90

  publish-firefox:
    name: Submit Firefox AMO
    needs: [package, verification]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.package.outputs.firefox == 'true' && needs.verification.result == 'success'
    runs-on: ubuntu-latest
    environment: firefox-store
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - uses: actions/download-artifact@v6
        with:
          name: workbench-frozen-release-${{ github.run_id }}
          path: release/frozen-input
      - run: node scripts/release.mjs restore --bundle release/frozen-input/release-bundle.zip --out-dir release/frozen --expected-source "$GITHUB_SHA"
      - uses: actions/download-artifact@v6
        with:
          name: ${{ needs.verification.outputs.artifact }}
          path: release
      - name: Recover the latest saved channel receipt
        id: receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs receipt-recovery --channel firefox --expected-source "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v6
        if: steps.receipt.outputs.mode == 'recover'
        with:
          artifact-ids: ${{ steps.receipt.outputs.artifact_id }}
          path: release/receipts
          merge-multiple: true
      - name: Submit or reconcile the exact frozen firefox candidate
        env:
          RELEASE_EXPECTED_SOURCE: ${{ inputs.expected_source }}
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: node scripts/release.mjs submit --channel firefox --manifest release/frozen/release-manifest.json --expected-source "$RELEASE_EXPECTED_SOURCE" --verification release/release-verification.json --receipt release/receipts/firefox.json
      - name: Preserve partial and accepted publication receipts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: workbench-release-receipt-firefox-${{ github.run_attempt }}
          path: release/receipts/firefox.json
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish the verified npm artifact
    needs: [package, verification]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.package.outputs.npm == 'true' && needs.verification.result == 'success'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - uses: actions/download-artifact@v6
        with:
          name: workbench-frozen-release-${{ github.run_id }}
          path: release/frozen-input
      - run: node scripts/release.mjs restore --bundle release/frozen-input/release-bundle.zip --out-dir release/frozen --expected-source "$GITHUB_SHA"
      - uses: actions/download-artifact@v6
        with:
          name: ${{ needs.verification.outputs.artifact }}
          path: release
      - name: Recover the latest saved channel receipt
        id: receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs receipt-recovery --channel npm --expected-source "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v6
        if: steps.receipt.outputs.mode == 'recover'
        with:
          artifact-ids: ${{ steps.receipt.outputs.artifact_id }}
          path: release/receipts
          merge-multiple: true
      - name: Submit or reconcile the exact frozen npm candidate
        env:
          RELEASE_EXPECTED_SOURCE: ${{ inputs.expected_source }}
        run: node scripts/release.mjs submit --channel npm --manifest release/frozen/release-manifest.json --expected-source "$RELEASE_EXPECTED_SOURCE" --verification release/release-verification.json --receipt release/receipts/npm.json
      - name: Preserve partial and accepted publication receipts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: workbench-release-receipt-npm-${{ github.run_attempt }}
          path: release/receipts/npm.json
          if-no-files-found: error
          retention-days: 90

  result:
    name: Companion verification result
    if: always()
    needs: [plan, checks, package, portable, firefox, release-bundle, fixture, panel, site, verification]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
      - name: Require success from every selected job
        env:
          PREFLIGHT_PLAN: ${{ needs.plan.outputs.plan }}
          PREFLIGHT_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/preflight.mjs --gate companion
      - name: Require complete manual release verification
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_VERIFICATION_RESULT: ${{ needs.verification.result }}
        run: node --input-type=module -e 'if (process.env.RELEASE_VERIFICATION_RESULT !== "success") throw new Error("Full pinned release verification did not succeed");'

  publication-result:
    name: Selected publication result
    if: always() && github.event_name == 'workflow_dispatch'
    needs: [package, verification, publish-chrome, publish-firefox, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
      - name: Require each explicitly selected channel
        env:
          RELEASE_CHANNELS: ${{ toJSON(needs.package.outputs) }}
          RELEASE_PUBLICATION_RESULTS: ${{ toJSON(needs) }}
          RELEASE_REQUESTED_CHANNELS: ${{ toJSON(inputs) }}
        run: |
          node --input-type=module -e 'const channels=JSON.parse(process.env.RELEASE_CHANNELS); const results=JSON.parse(process.env.RELEASE_PUBLICATION_RESULTS); const requested=JSON.parse(process.env.RELEASE_REQUESTED_CHANNELS); for (const [channel,job] of [["chrome","publish-chrome"],["firefox","publish-firefox"],["npm","publish"]]) if (requested[`publish_${channel}`] === true && (channels[channel] !== "true" || results[job]?.result !== "success")) throw new Error(`${channel} publication requires attention (${results[job]?.result ?? "missing"})`);'
