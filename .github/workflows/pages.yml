name: Build and deploy public site

on:
  pull_request:
    paths:
      - ".github/workflows/pages.yml"
      - "package.json"
      - "package-lock.json"
      - "PRIVACY.md"
      - "SECURITY.md"
      - "site/**"
      - "scripts/build-site.mjs"
      - "scripts/check-site.mjs"
      - "scripts/site-server.mjs"
      - "playwright.site.config.ts"
      - "tests/site/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "package.json"
      - "package-lock.json"
      - "PRIVACY.md"
      - "SECURITY.md"
      - "site/**"
      - "scripts/build-site.mjs"
      - "scripts/check-site.mjs"
      - "scripts/site-server.mjs"
      - "playwright.site.config.ts"
      - "tests/site/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Validate public site
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser for public-site verification
        run: npx playwright install --with-deps chromium
      - name: Build and verify the public-only artifact
        run: npm run test:site
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site-dist

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
