name: Build and deploy public site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  plan:
    name: Select required checks
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.selection.outputs.plan }}
      docs: ${{ steps.selection.outputs.docs }}
      site: ${{ steps.selection.outputs.site }}
      runtime: ${{ steps.selection.outputs.runtime }}
      companion: ${{ steps.selection.outputs.companion }}
      panel: ${{ steps.selection.outputs.panel }}
      fixture: ${{ steps.selection.outputs.fixture }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
      - name: Verify check selection and aggregate contracts
        run: node --test scripts/preflight.test.mjs
      - name: Select changed-input or full-release checks
        id: selection
        env:
          PREFLIGHT_RELEASE: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/preflight.mjs --ci --dry-run --github-output "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.site == 'true'
    name: Validate public site
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser for public-site verification
        run: npx playwright install --with-deps chromium
      - name: Build and verify the public-only artifact
        run: npm run test:site
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site-dist

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && needs.plan.outputs.site == 'true'
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5

  result:
    name: Public site verification result
    if: always()
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
      - name: Require success from every selected job
        env:
          PREFLIGHT_PLAN: ${{ needs.plan.outputs.plan }}
          PREFLIGHT_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/preflight.mjs --gate site
