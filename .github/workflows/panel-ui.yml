name: Panel UI browser gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      full:
        description: Run every verification gate for a pinned release
        type: boolean
        default: true
      frozen_artifact:
        description: Same-run frozen candidate artifact for release verification
        type: string
        default: ''

permissions:
  contents: read

jobs:
  plan:
    name: Select required checks
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.selection.outputs.plan }}
      docs: ${{ steps.selection.outputs.docs }}
      site: ${{ steps.selection.outputs.site }}
      runtime: ${{ steps.selection.outputs.runtime }}
      companion: ${{ steps.selection.outputs.companion }}
      panel: ${{ steps.selection.outputs.panel }}
      fixture: ${{ steps.selection.outputs.fixture }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
      - name: Verify check selection and aggregate contracts
        run: node --test scripts/preflight.test.mjs
      - name: Select changed-input or full-release checks
        id: selection
        env:
          PREFLIGHT_RELEASE: ${{ inputs.full || false }}
        run: node scripts/preflight.mjs --ci --dry-run --github-output "$GITHUB_OUTPUT"

  panel-ui:
    needs: plan
    if: needs.plan.outputs.panel == 'true'
    name: Panel UI browser gate
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    # The 328 browser checks plus 107-state visual packet can exceed 25 minutes
    # before the real-extension smoke. Keep orchestration headroom separate
    # from the unchanged per-test and measured operation budgets.
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Visual review references accepted snapshots at recorded revisions.

      - name: Trust the mounted checkout in the job container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download the pinned release inputs
        if: inputs.frozen_artifact != ''
        uses: actions/download-artifact@v6
        with:
          name: ${{ inputs.frozen_artifact }}
          path: release/frozen-input
      - name: Validate and restore the pinned release manifest
        if: inputs.frozen_artifact != ''
        id: frozen
        run: node scripts/release.mjs restore --bundle release/frozen-input/release-bundle.zip --out-dir release/frozen --expected-source "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"

      - name: Cache Chrome for Testing
        uses: actions/cache@v5
        with:
          path: .cache/lsew-browsers
          key: chrome-for-testing-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chrome for Testing
        run: npm run fixture:browser:install

      - name: Verify pinned Playwright browser environment
        run: npx playwright --version

      - name: Typecheck and run unit contracts
        run: |
          npm run typecheck
          npm test
          npm run docs:check

      - name: Build and audit the production extension
        run: npm run build

      - name: Package within the Chrome Store budget
        run: node scripts/package-extension.mjs --skip-typecheck --skip-tests --skip-build --out-dir test-results/release

      - name: Run panel UI browser gate
        env:
          CI: true
          LSEW_UI_UPDATE: "0"
        run: npm run test:ui

      - name: Generate prototype and production visual review evidence
        run: npm run test:ui:visual

      - name: Run unpacked production extension smoke
        env:
          LSEW_FROZEN_RELEASE_MANIFEST: ${{ inputs.frozen_artifact != '' && 'release/frozen/release-manifest.json' || '' }}
        run: node scripts/test-ui-extension.mjs

      - name: Upload panel UI diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: panel-ui-browser-diagnostics
          path: |
            test-results/ui/
            test-results/ui-report/
            test-results/workbench-visual-qa/
            test-results/release/
          if-no-files-found: warn

  result:
    name: Panel verification result
    if: always()
    needs: [plan, panel-ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
      - name: Require success from every selected job
        env:
          PREFLIGHT_PLAN: ${{ needs.plan.outputs.plan }}
          PREFLIGHT_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/preflight.mjs --gate panel
