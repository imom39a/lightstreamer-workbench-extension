name: Panel UI browser gate

on:
  pull_request:
    paths:
      - ".github/workflows/panel-ui.yml"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - "scripts/test-ui.mjs"
      - "scripts/test-ui-update.mjs"
      - "scripts/generate-workbench-visual-evidence.mjs"
      - "scripts/check-docs.mjs"
      - "scripts/ui-panel-server.mjs"
      - "scripts/verify-extension-build.mjs"
      - "scripts/package-extension.mjs"
      - "src/bridge/**"
      - "src/core/**"
      - "src/extension/panel/**"
      - "tests/panel-*.test.ts"
      - "tests/extension-panel.browser.spec.ts"
      - "tests/support/panel-scenarios.ts"
      - "tests/support/workbench-scenarios.ts"
      - "tests/ui/**"
      - "docs/agents/ui-verification.md"
      - "docs/agents/ui-visual-qa.md"
      - "CONTRIBUTING.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  panel-ui:
    name: Panel UI browser gate
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Chrome for Testing
        uses: actions/cache@v5
        with:
          path: .cache/lsew-browsers
          key: chrome-for-testing-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chrome for Testing
        run: npm run fixture:browser:install

      - name: Verify pinned Playwright browser environment
        run: npx playwright --version

      - name: Typecheck and run unit contracts
        run: |
          npm run typecheck
          npm test
          npm run docs:check

      - name: Build and audit the production extension
        run: npm run build

      - name: Package within the Chrome Store budget
        run: node scripts/package-extension.mjs --skip-typecheck --skip-tests --skip-build --out-dir test-results/release

      - name: Run panel UI browser gate
        env:
          CI: true
          LSEW_UI_UPDATE: "0"
        run: npm run test:ui

      - name: Generate prototype and production visual review evidence
        run: npm run test:ui:visual

      - name: Run unpacked production extension smoke
        run: node scripts/test-ui-extension.mjs

      - name: Upload panel UI diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: panel-ui-browser-diagnostics
          path: |
            test-results/ui/
            test-results/ui-report/
            test-results/workbench-visual-qa/
            test-results/release/
          if-no-files-found: warn
