name: Fixture script compatibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-runner:
    name: Fixture runner (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify cross-platform fixture entry points
        run: npm test

      - name: Exercise the full fixture orchestration without external services
        run: npm run fixture:test:dry-run

  local-injection-browser:
    name: Official-client Local Injection proof
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install dependencies
        run: npm ci

      - name: Cache Chrome for Testing
        uses: actions/cache@v5
        with:
          path: .cache/lsew-browsers
          key: chrome-for-testing-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chrome for Testing
        run: npm run fixture:browser:install

      - name: Prove capture and Local Injection through the production panel
        run: npm run fixture:test:browser
