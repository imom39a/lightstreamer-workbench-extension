name: Fixture script compatibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      full:
        description: Run every verification gate for a pinned release
        type: boolean
        default: true
      frozen_artifact:
        description: Same-run frozen candidate artifact for release verification
        type: string
        default: ''

permissions:
  contents: read

jobs:
  plan:
    name: Select required checks
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.selection.outputs.plan }}
      docs: ${{ steps.selection.outputs.docs }}
      site: ${{ steps.selection.outputs.site }}
      runtime: ${{ steps.selection.outputs.runtime }}
      companion: ${{ steps.selection.outputs.companion }}
      panel: ${{ steps.selection.outputs.panel }}
      fixture: ${{ steps.selection.outputs.fixture }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
      - name: Verify check selection and aggregate contracts
        run: node --test scripts/preflight.test.mjs
      - name: Select changed-input or full-release checks
        id: selection
        env:
          PREFLIGHT_RELEASE: ${{ inputs.full || false }}
        run: node scripts/preflight.mjs --ci --dry-run --github-output "$GITHUB_OUTPUT"

  fixture-runner:
    needs: plan
    if: needs.plan.outputs.fixture == 'true'
    name: Fixture runner (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify cross-platform fixture entry points
        run: npm test

      - name: Exercise the full fixture orchestration without external services
        run: npm run fixture:test:dry-run

  local-injection-browser:
    needs: plan
    if: needs.plan.outputs.fixture == 'true'
    name: Official-client + MCP Local Injection proof
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install dependencies
        run: npm ci

      - name: Download the pinned release inputs
        if: inputs.frozen_artifact != ''
        uses: actions/download-artifact@v6
        with:
          name: ${{ inputs.frozen_artifact }}
          path: release/frozen-input
      - name: Validate and restore the pinned release manifest
        if: inputs.frozen_artifact != ''
        id: frozen
        run: node scripts/release.mjs restore --bundle release/frozen-input/release-bundle.zip --out-dir release/frozen --expected-source "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"
      - name: Use the frozen companion version in the fixture proof
        if: inputs.frozen_artifact != ''
        run: node scripts/release.mjs use-agent --manifest release/frozen/release-manifest.json --expected-source "$GITHUB_SHA"

      - name: Cache Chrome for Testing
        uses: actions/cache@v5
        with:
          path: .cache/lsew-browsers
          key: chrome-for-testing-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chrome for Testing
        run: npm run fixture:browser:install

      - name: Prove failure evidence survives real Chrome teardown
        run: npm run test:browser-diagnostics

      - name: Prove capture, MCP tooling and Local Injection through the production panel
        env:
          LSEW_FROZEN_RELEASE_MANIFEST: ${{ inputs.frozen_artifact != '' && 'release/frozen/release-manifest.json' || '' }}
          LSEW_AGENT_PACKAGE_TARBALL: ${{ inputs.frozen_artifact != '' && format('release/frozen/{0}', steps.frozen.outputs.filename) || '' }}
        run: npm run agent:test:browser

      - name: Retain failed browser attempts and fixture reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fixture-browser-failure-${{ github.run_attempt }}
          path: |
            test-results/browser-diagnostics*/
            test-results/extension-ui*/
          if-no-files-found: ignore
          retention-days: 14

  result:
    name: Fixture verification result
    if: always()
    needs: [plan, fixture-runner, local-injection-browser]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
      - name: Require success from every selected job
        env:
          PREFLIGHT_PLAN: ${{ needs.plan.outputs.plan }}
          PREFLIGHT_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/preflight.mjs --gate fixture
